<header class="d-flex flex-row align-items-center justify-content-between p-3 px-4 mb-3
bg-white border-bottom fixed-top shadow-sm">
  <img src="/assets/images/logo.png" alt="logo" class="logo" style="max-height: 70px;" routerLink="/">
  <nav class="my-2 text-uppercase fs-3">
    <a class="p-2" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
    <a class="p-2" routerLink="/shop" routerLinkActive="active">Shop</a>
    <a class="p-2" routerLink="/contact" routerLinkActive="active">Contact</a>
  </nav>
  <div class="d-flex align-items-center">
    <a class="position-relative" routerLink="/cart" aria-label="Shopping cart">
      <i class="fa fa-shopping-cart fa-2x me-5 text-dark"></i>
      <div class="cart-no" *ngIf="cartItemCount$ | async as cartItemCount">
        {{ cartItemCount }}
      </div>
    </a>
    <button type="button" class="btn btn-outline-secondary me-2" disabled>Login</button>
    <button type="button" class="btn btn-outline-secondary me-3" disabled>Sign Up</button>
  </div>
</header>
