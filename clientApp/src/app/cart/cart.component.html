<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0">Your cart</h1>
    <button *ngIf="items.length" class="btn btn-outline-danger" type="button" (click)="clearCart()">Clear cart</button>
  </div>

  <div *ngIf="!items.length" class="empty-cart text-center py-5">
    <i class="fa fa-shopping-cart fa-3x text-muted mb-3"></i>
    <h2>Your cart is empty</h2>
    <p class="text-muted">Browse our products and add something you like.</p>
    <a routerLink="/shop" class="btn btn-primary">Continue shopping</a>
  </div>

  <div *ngIf="items.length" class="row g-4">
    <div class="col-lg-8">
      <div *ngFor="let item of items" class="card mb-3 shadow-sm">
        <div class="card-body d-flex align-items-center gap-3">
          <img [src]="item.product.pictureUrl" [alt]="item.product.name" class="product-image">
          <div class="flex-grow-1">
            <a [routerLink]="['/shop', item.product.id]" class="h5 text-decoration-none">{{ item.product.name }}</a>
            <div class="text-muted">{{ item.product.price | currency }} each</div>
          </div>
          <input class="form-control quantity" type="number" min="0" [value]="item.quantity" (change)="updateQuantity(item, $event)" aria-label="Quantity">
          <strong>{{ item.product.price * item.quantity | currency }}</strong>
          <button class="btn btn-link text-danger" type="button" (click)="removeItem(item.product.id)" aria-label="Remove item">
            <i class="fa fa-trash"></i>
          </button>
        </div>
      </div>
    </div>
    <div class="col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h2 class="h4">Order summary</h2>
          <div class="d-flex justify-content-between border-top pt-3 mt-3">
            <strong>Total</strong>
            <strong>{{ total | currency }}</strong>
          </div>
          <button class="btn btn-primary w-100 mt-3" type="button" disabled>Checkout coming soon</button>
        </div>
      </div>
    </div>
  </div>
</div>
